# private.cyphras.com -> cy1 Go stack on 2.25.202.9 (XLM pool). Keeper (8102) is
# polled on loopback by the admin-api, not routed publicly. USDC pool not yet
# deployed, so /usdc/* is intentionally absent.
#
# Apply on the VPS:
#   sudo cp this file to /etc/nginx/sites-available/private.cyphras.com
#   sudo ln -s /etc/nginx/sites-available/private.cyphras.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d private.cyphras.com   # issues + wires TLS
server {
  listen 80;
  server_name private.cyphras.com;

  # SSE: unbuffered, long-lived; must precede the /indexer/ prefix to win the match.
  location = /indexer/stream {
    proxy_pass http://127.0.0.1:8100/stream;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /indexer/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /relayer/ {
    proxy_pass http://127.0.0.1:8101/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
